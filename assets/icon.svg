        transform="rotate(-9 64 64) translate(-13 -3)"/>

  <!-- Front file -->
  <rect x="42" y="32" width="44" height="64" rx="7" fill="#ffffff"/>

  <!-- Closed eye = hidden -->
  <g stroke="#6366F1" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M50 62 Q64 76 78 62"/>
    <path d="M54.5 68 L51 74.5"/>
    <path d="M64 71.5 L64 79.5"/>
    <path d="M73.5 68 L77 74.5"/>
  </g>
</svg>
