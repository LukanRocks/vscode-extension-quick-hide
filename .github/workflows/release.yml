name: Release

# Runs on every push to main (i.e. whenever a PR is squash-merged).
#
# The next version is derived from the latest git tag, incrementing the major
# number (v1.0.1 -> v2.0.0 -> v3.0.0). The release is tagged and published as a
# GitHub Release with the .vsix attached.
#
# This workflow NEVER pushes to main. It only creates a tag and a GitHub
# Release, so it is fully compatible with the "Protect Main" ruleset (required
# PR, signed commits, linear history) without needing any bypass. Because of
# that, package.json's version on main is only a base value -- the source of
# truth for released versions is the git tags.
#
# The Marketplace upload stays manual: download the .vsix from the release and
# upload it at https://marketplace.visualstudio.com/manage (Azure DevOps no
# longer issues the long-lived tokens that automated publishing would need).
on:
  push:
    branches: [main]

# Never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve next version
        id: ver
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            new="1.0.0"
          else
            base="${latest#v}"
            major="${base%%.*}"
            new="$((major + 1)).0.0"
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${latest:-none} -> releasing v$new"

      - name: Build the versioned VSIX
        run: |
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          npx @vscode/vsce package -o "quick-hide-${{ steps.ver.outputs.version }}.vsix"

      - name: Tag the release
        run: |
          git commit -am "chore(release): v${{ steps.ver.outputs.version }}"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "quick-hide-${{ steps.ver.outputs.version }}.vsix" \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes
